<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Controlix | Dashboard</title>

    <!-- CSS DEL DASHBOARD -->
    <link rel="stylesheet" href="dashboard.css">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>

    <!-- =========================================
         BARRA SUPERIOR
    ========================================== -->

    <header class="barra_superior">


        <!-- ===============================
             LOGO CONTROLIX
        ================================ -->

        <div class="barra_logo">

            <img src="img/controlix.png"
                 alt="Controlix"
                 class="logo_controlix">

        </div>


        <!-- ===============================
             INFORMACIÓN DEL USUARIO
        ================================ -->

        <div class="barra_usuario">


            <!-- LÍNEA SEPARADORA -->

            <div class="separador_usuario"></div>


            <!-- ICONO DEL USUARIO -->

            <div class="usuario_icono">

                <i class="fa-solid fa-user"></i>

            </div>


            <!-- NOMBRE Y ROL -->

            <div class="usuario_datos">

                <span class="usuario_nombre">
                    Kenia Ramírez
                </span>

                <span class="usuario_rol">
                    Administrador
                </span>

            </div>


            <!-- FLECHA -->

            <i class="fa-solid fa-chevron-down usuario_flecha"></i>


        </div>


    </header>


</body>

</html>
