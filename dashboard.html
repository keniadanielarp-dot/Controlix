<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Controlix | Dashboard</title>

    <!-- Bootstrap 5 local -->
    <link rel="stylesheet"
          href="./bootstrap/css/bootstrap.min.css">

    <!-- Cargar íconos de bootstrap locales  -->
    <link rel="stylesheet" href="./css/bootstrap-icons.css">

    <!-- Referencia a css -->
    <link rel="stylesheet" href="dashboard.css">
</head>


<body> 
 <!-- Panel lateral azul  -->
 <aside class="panel" id="side_panel">

    <!-- Nombre del proyecto -->
    <div class="project_title">

        <h2>Control<span>ix</span></h2>
     </div>

    <!-- Menú de navegación -->
    <nav class="menu" aria-label="Menu principal">

        <a href="dashboard.html" class="option_menu activo" aria-current="page">
       
            <!-- Opcion Dashboard -->
            <i class="bi bi-house-door-fill" aria-hidden="true"></i>
            <span>Dashboard</span>
        </a>

        <!-- Opcion Usuario -->
        <a href="#" class="option_menu">
            <i class="bi bi-people" aria-hidden="true"></i>
            <span>Usuarios</span>
        </a>
    </nav>
 </aside>

 <!-- Contenido -->        
 <main class="content">
 <!-- barra superior --> 
       <header class="top_bar">

        <!--Boton plegar y desplegar el panel lateral -->
          <button class="button_menu" id="button_line" type="button" aria-label="Ocultar menu" aria-controls="side_panel" aria-expanded="true">
        
              <!-- Icono tres lineas -->
              <i class="bi bi-list"></i>

            </button>
        </header>
        <nav class="route_nav" aria-label="Ruta de navegación">

            <!--icono casa-->
           <a href="dashboard.html" class="home_route" aria-label="Inicio">
              <i class="bi bi-house-door"></i>
            </a>

        <!--icono linea-->    
         <span class="divider">/</span>

         <!--Nombre pagina actual-->
         <span class="current_route" aria-current="page">Dashboard</span>

</main>
 </nav>
</body>
</html>
