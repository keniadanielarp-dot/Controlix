<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>

    <!-- Referencia al diseño -->
    <link rel="stylesheet" href="../css/login.css">

    <!-- Bootstrap 5 local -->
    <link rel="stylesheet"
          href="../bootstrap/css/bootstrap.min.css">

    <!-- Cargar íconos de bootstrap locales  -->
    <link rel="stylesheet" href="../css/bootstrap-icons.css">

</head>


<body>
    <main class="login_container">

        <!-- Título del programa -->
        <section class="program_info">
            <div class="program_title">
                <img
                    src="../img/controlix.png"
                    alt="Logo"
                    class="controlix_logo">

                    <h1>Controlix</h1>
            </div> 
        </section>


        <!-- Tarjeta -->
        <section class="graphic_card">
            <h2 class="recover_title">
                Recuperar contraseña
            </h2>

            <p class="recover_text">
                Ingrese el correo electrónico asociado a su cuenta.
            </p>


            <form id="form_recover">

                <!-- Correo -->
                <div class="form_group">

                    <label for="correo">
                        Correo electrónico:
                    </label>

                    <div class="input_container">
                        <i class="bi bi-envelope-fill"></i>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="Ingrese su correo"
                            required>

                    </div>
                </div>


                <!-- Botón -->
                <button
                    type="submit"
                    class="contact_button">
                    Recuperar
                </button>


                <!-- Regresar -->
                <div class="forgot_pass">
                    <a href="login.html">
                        <i class="bi bi-arrow-left"></i>
                        Regresar a iniciar sesión
                    </a>
                </div>
            </form>
        </section>
    </main>


    <script>
        const form =
            document.getElementById("form_recover");

        form.addEventListener(
            "submit",
            function(event) {
                event.preventDefault();
                alert(
                    "Por favor, comuníquese con un administrador de TI para proporcionarle una nueva contraseña."
                );
            }
        );
    </script>
</body>
</html>
