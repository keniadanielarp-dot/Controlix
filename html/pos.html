<!-- Contenido principal de POS -->
<section class="pos_content">

    <!-------------------- BLOQUE: Encabezado ---------------------->
    <div class="pos_header">

        <!-- Icono y título -->
        <div class="pos_header_title">
            <i class="bi bi-file-text-fill"></i>
            <h2>Po's</h2>
        </div>

        <!-- Botones del encabezado -->
        <div class="pos_header_buttons">

            <!-- Botón Cargar Excel -->
            <!-- Campo para seleccionar archivos Excel -->
            <input type="file" id="file_pos_excel" accept=".xlsx,.xls" hidden>

            <!-- Botón visual para abrir el explorador -->
            <label for="file_pos_excel" id="btn_load_excel" class="pos_btn pos_btn_excel" role="button" tabindex="0">
                <i class="bi bi-upload"></i>
                Cargar Excel
            </label>

            <!-- Archivo Excel seleccionado -->
            <input type="file" id="file_pos_excel" accept=".xlsx,.xls" hidden>

            <!-- Botón Crear -->
            <button type="button" id="btn_new_pos" class="pos_btn pos_btn_new">
                <i class="bi bi-plus-lg"></i>
                Crear
            </button>

            <button type="button" id="btn_edit_pos" class="pos_btn pos_btn_edit">
                <i class="bi bi-pencil-square"></i>
                Editar
            </button>

            <button type="button" id="btn_delete_pos" class="pos_btn pos_btn_delete">
                <i class="bi bi-trash3"></i>
                Eliminar
            </button>
        </div>
    </div>

    <!--------------- BLOQUE: Buscador, filtros y botones de asignación   ---------------------->
    <div class="pos_tools">
        <div class="pos_tools_filters">

            <!-- Buscador de artículos -->
            <div class="pos_search">
                <i class="bi bi-search"></i>
                <input type="search" id="search_pos" placeholder="Buscar por ID, po's o modelo..." autocomplete="off">
            </div>

            <!-- Filtro de mes y año -->
            <div class="pos_filter">
                <label for="dpdn_pos_mounth">
                    Mes
                </label>

                <div class="pos_dropdown">
                    <i class="bi bi-calendar3"></i>
                    <input type="month" id="dpdn_pos_mounth" name="filter_pos_month">
                </div>
            </div>

            <!-- Filtro por estado -->
            <div class="pos_filter">

                <label for="options_pos_status">
                    Estado
                </label>

                <div class="pos_dropdown">
                    <i class="bi bi-layers"></i>
                    <select id="options_pos_status">
                        <option value="">Todos</option>
                        <option value="pending">Pendiente</option>
                        <option value="assigned">Asignado</option>
                        <option value="process">En proceso</option>
                        <option value="finished">Finalizado</option>
                    </select>
                </div>
            </div>

            <!-- Filtro por usuario asignado -->
            <div class="pos_filter">

                <label for="options_user_assing">
                    Usuario asignado
                </label>

                <div class="pos_dropdown">
                    <i class="bi bi-person"></i>
                    <select id="options_user_assing">
                        <option value="">Todos</option>
                    </select>
                </div>
            </div>
        </div>

        <!---------------------- Botones de asignación ---------------------->
        <div class="pos_assign">

            <!-- Asignar inspección -->
            <button type="button" id="btn_type_ins" class="pos_assign_btn pos_type_inspection">
                <i class="bi bi-clipboard-check"></i>
                Asignar inspección
            </button>

            <!-- Asignar usuario -->
            <button type="button" id="btn_assign_user" class="pos_assign_btn pos_assign_user">
                <i class="bi bi-person-plus-fill"></i>
                Asignar usuario
            </button>
        </div>
    </div>


    <!--------------------------------------------------- BLOQUE: Tabla Po's  ------------------------------------------------>

    <section class="pos_table_section">

        <!-- Desplazamiento horizontal -->
        <div class="pos_table_scroll">

            <table class="pos_table_css" id="pos_table_js">

                <!-- Encabezados -->
                <thead>
                    <tr>
                        <th>
                            <input type="checkbox" id="select_all_pos" aria-label="Seleccionar todos">
                        </th>

                        <th>ID</th>
                        <th>Po's Adidas</th>
                        <th>Model #</th>
                        <th>Art #</th>
                        <th>Color</th>
                        <th>XS</th>
                        <th>S</th>
                        <th>M</th>
                        <th>L</th>
                        <th>XL</th>
                        <th>2XL</th>
                        <th>3XL</th>
                        <th>4XL</th>
                        <th>T.Units RQSTD</th>
                        <th>T. Units DELVD</th>
                        <th>Usuario asignado</th>
                        <th>Fecha de asignación</th>
                        <th>Estado</th>
                        <th>Tipo de inspección</th>
                        <th>Fecha</th>
                    </tr>
                </thead>

                <!-- Registros cargados desde Excel -->
                <tbody id="pos_table_excel">

                </tbody>
            </table>
        </div>

        <!--------------------------------------------------- BLOQUE: Pie de tabla  ------------------------------------------------>
        <!-- Label Total -->
        <div class="pos_table_footer">
            <span>Total de registros: null </span>

            <!-- Paginación -->
            <div class="pos_pag">

                <!-- Anterior -->
                <button type="button" disabled aria-label="Página anterior">
                    <i class="bi bi-chevron-left"></i>
                </button>

                <button type="button" class="active" aria-current="page">
                    1
                </button>

                <!-- Siguiente -->
                <button type="button" disabled aria-label="Página siguiente">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>
    </section>


    <!--------------------------------------------------- BLOQUE: Botón Guardar   ------------------------------------------------>
    <div class="btn_pos_save">
        <button type="button" id="btn_save_pos">
            <i class="bi bi-database-check"></i>
            Guardar
        </button>
    </div>


    <!-------------------------------------------------------------------------------------------------------- -->
    <!------------------------------- BLOQUE: Formulario Botón CREAR   --------------------------------------- -->
    <!-------------------------------------------------------------------------------------------------------- -->

    <div id="create_pos_js" class="pos_modal_overlay" hidden>

        <!-- Cuadro central -->
        <div class="pos_modal_css pos_modal_large" role="dialog" aria-modal="true" aria-labelledby="create_pos_title">

            <!-- Encabezado -->
            <div class="pos_modal_header">

                <h2 id="edit_modal_title">
                    Crear PO
                </h2>

                <!-- Botón X  -->
                <button type="button" id="btn_x_modal" aria-label="Cerrar ventana">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <!-- Formulario -->
            <form id="form_create_pos" class="pos_form" novalidate>

                <div class="input_grid">
                    <!-- PO -->
                    <div class="input_pos_form">
                        <label for="lbl_create_po">
                            PO
                            <span class="pos_required">*</span>
                        </label>
                        <input type="text" id="txt_create_po" placeholder="Ingresar PO" autocomplete="off" required>
                        <small class="input_error" id="error_new_po" hidden></small>
                    </div>


                    <!-- Modelo -->
                    <div class="input_pos_form">
                        <label for="lbl_create_model">
                            Modelo
                            <span class="pos_required">*</span>
                        </label>
                        <input type="text" id="txt_new_model" placeholder="Ingrese modelo" autocomplete="on" required>
                        <small class="input_error" id="error_new_model" hidden></small>
                    </div>


                    <!-- Artículo -->
                    <div class="input_pos_form">
                        <label for="lbl_create_art">
                            Artículo
                            <span class="pos_required">*</span>
                        </label>
                        <input type="text" id="txt_new_art" placeholder="Ingrese artículo" autocomplete="on" required>
                        <small class="input_error" id="error_new_art" hidden></small>
                    </div>

                    <!-- Color -->
                    <div class="input_pos_form">
                        <label for="lbl_create_color">
                            Color
                            <span class="pos_required">*</span>
                        </label>
                        <input type="text" id="txt_new_color" placeholder="Ingrese color" autocomplete="on" required>
                        <small class="input_error" id="error_new_color" hidden></small>
                    </div>
                </div>

                <div class="input_size">

                    <!-- Tallas  -->
                    <label for="lbl_size">
                        Talla
                        <span class="pos_required">*</span>
                    </label>

                    <div class="input_grid">
                        <!-- XS -->
                        <div class="input_pos_form">
                            <label for="lbl_po_xs">
                                XS
                            </label>
                            <input type="text" id="txt_new_xs" autocomplete="on" required>
                        </div>


                        <!-- S -->
                        <div class="input_pos_form">
                            <label for="lbl_po_s">
                                S
                            </label>
                            <input type="text" id="txt_new_s" autocomplete="on" required>
                        </div>


                        <!-- M -->
                        <div class="input_pos_form">
                            <label for="lbl_po_m">
                                M
                            </label>
                            <input type="text" id="txt_new_m" autocomplete="on" required>
                        </div>


                        <!-- L -->
                        <div class="input_pos_form">
                            <label for="lbl_po_l">
                                L
                            </label>
                            <input type="text" id="txt_new_l" autocomplete="on" required>
                        </div>


                        <!-- XL -->
                        <div class="input_pos_form">
                            <label for="lbl_po_xl">
                                XL
                            </label>
                            <input type="text" id="txt_new_xl" autocomplete="on" required>
                        </div>


                        <!-- 2XL -->
                        <div class="input_pos_form">
                            <label for="lbl_po_2xl">
                                2XL
                            </label>
                            <input type="text" id="txt_new_2xl" autocomplete="on" required>
                        </div>


                        <!-- 3XL -->
                        <div class="input_pos_form">
                            <label for="lbl_po_3xl">
                                3XL
                            </label>
                            <input type="text" id="txt_new_3xl" autocomplete="on" required>
                        </div>


                        <!-- 4XL -->
                        <div class="input_pos_form">
                            <label for="lbl_po_4xl">
                                4XL
                            </label>
                            <input type="text" id="txt_new_3xl" autocomplete="on" required>
                        </div>
                    </div>
                </div>

                <div class="input_grid">
                    <!-- T.Units RQSTD -->
                    <div class="input_pos_form">
                        <label for="lbl_rqstd">
                            T.Units RQSTD
                            <span class="pos_required">*</span>
                        </label>
                        <input type="text" id="txt_new_rqstd" placeholder="Ingrese RQSTD" autocomplete="off" required>
                        <small class="input_error" id="error_new_rqstd" hidden></small>
                    </div>

                    <!-- T.Units DELVD -->
                    <div class="input_pos_form">
                        <label for="lbl_rqstd">
                            T.Units DELVD
                            <span class="pos_required">*</span>
                        </label>
                        <input type="text" id="txt_new_delvd" placeholder="Ingrese DELVD" autocomplete="off" required>
                        <small class="input_error" id="error_new_delvd" hidden></small>
                    </div>
                </div>


                <!-- Botones del formulario  -->
                <div class="btns_po">
                    <button type="button" id="btn_cancel_po">
                        Cancelar
                    </button>
                    <button type="submit" id="btn_save_po">
                        <i class="bi bi-floppy-fill"></i>
                        Guardar
                    </button>
                </div>
            </form>

        </div>
    </div>

    <!-------------------------------------------------------------------------------------------------------- -->
    <!------------------------------- BLOQUE: Formulario Botón Editar   --------------------------------------- -->
    <!-------------------------------------------------------------------------------------------------------- -->

    <div id="edit_pos_js" class="pos_modal_overlay" hidden>

        <!-- Cuadro central -->
        <div class="pos_modal_css pos_modal_large" role="dialog" aria-modal="true" aria-labelledby="edit_pos_title">

            <!-- Encabezado -->
            <div class="pos_modal_header">

                <h2 id="edit_modal_title">
                    Editar PO
                </h2>

                <!-- Botón X  -->
                <button type="button" id="btn_x_modal" aria-label="Cerrar ventana">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            <!-- Formulario -->
            <form id="form_edit_pos" class="pos_form" novalidate>

                <div class="input_grid"> <!-- Primera agrupación -->

                    <!-- PO -->
                    <div class="input_pos_form">
                        <label for="lbl_edit_po">
                            PO
                            <span class="pos_required">*</span>
                        </label>
                        <input type="text" id="txt_edit_po" placeholder="Ingresar PO" autocomplete="off" required>
                        <small class="input_error" id="error_edit_po" hidden></small>
                    </div>


                    <!-- Modelo -->
                    <div class="input_pos_form">
                        <label for="lbl_edit_model">
                            Modelo
                            <span class="pos_required">*</span>
                        </label>
                        <input type="text" id="txt_edit_model" placeholder="Ingrese modelo" autocomplete="on" required>
                        <small class="input_error" id="error_edit_model" hidden></small>
                    </div>


                    <!-- Artículo -->
                    <div class="input_pos_form">
                        <label for="lbl_edit_art">
                            Artículo
                            <span class="pos_required">*</span>
                        </label>
                        <input type="text" id="txt_edit_art" placeholder="Ingrese artículo" autocomplete="on" required>
                        <small class="input_error" id="error_edit_art" hidden></small>
                    </div>

                    <!-- Color -->
                    <div class="input_pos_form">
                        <label for="lbl_edit_color">
                            Color
                            <span class="pos_required">*</span>
                        </label>
                        <input type="text" id="txt_edit_color" placeholder="Ingrese color" autocomplete="on" required>
                        <small class="input_error" id="error_edit_color" hidden></small>
                    </div>
                </div>

                <div class="input_size">

                    <!-- Tallas  -->
                    <label for="lbl_size">
                        Talla
                        <span class="pos_required">*</span>
                    </label>

                    <div class="input_grid">
                        <!-- XS -->
                        <div class="input_pos_form">
                            <label for="lbl_po_xs">
                                XS
                            </label>
                            <input type="text" id="txt_edit_xs" autocomplete="on" required>
                        </div>


                        <!-- S -->
                        <div class="input_pos_form">
                            <label for="lbl_po_s">
                                S
                            </label>
                            <input type="text" id="txt_edit_s" autocomplete="on" required>
                        </div>


                        <!-- M -->
                        <div class="input_pos_form">
                            <label for="lbl_po_m">
                                M
                            </label>
                            <input type="text" id="txt_edit_m" autocomplete="on" required>
                        </div>


                        <!-- L -->
                        <div class="input_pos_form">
                            <label for="lbl_po_l">
                                L
                            </label>
                            <input type="text" id="txt_edit_l" autocomplete="on" required>
                        </div>


                        <!-- XL -->
                        <div class="input_pos_form">
                            <label for="lbl_po_xl">
                                XL
                            </label>
                            <input type="text" id="txt_edit_xl" autocomplete="on" required>
                        </div>


                        <!-- 2XL -->
                        <div class="input_pos_form">
                            <label for="lbl_po_2xl">
                                2XL
                            </label>
                            <input type="text" id="txt_edit_2xl" autocomplete="on" required>
                        </div>


                        <!-- 3XL -->
                        <div class="input_pos_form">
                            <label for="lbl_po_3xl">
                                3XL
                            </label>
                            <input type="text" id="txt_edit_3xl" autocomplete="on" required>
                        </div>


                        <!-- 4XL -->
                        <div class="input_pos_form">
                            <label for="lbl_po_4xl">
                                4XL
                            </label>
                            <input type="text" id="txt_edit_3xl" autocomplete="on" required>
                        </div>
                    </div>
                </div>

                <div class="input_grid">

                    <!-- T.Units RQSTD -->
                    <div class="input_pos_form">
                        <label for="lbl_rqstd">
                            T.Units RQSTD
                            <span class="pos_required">*</span>
                        </label>
                        <input type="text" id="txt_edit_rqstd" placeholder="Ingrese RQSTD" autocomplete="off" required>
                        <small class="input_error" id="error_edit_rqstd" hidden></small>
                    </div>

                    <!-- T.Units DELVD -->
                    <div class="input_pos_form">
                        <label for="lbl_rqstd">
                            T.Units DELVD
                            <span class="pos_required">*</span>
                        </label>
                        <input type="text" id="txt_edit_delvd" placeholder="Ingrese DELVD" autocomplete="off" required>
                        <small class="input_error" id="error_edit_delvd" hidden></small>
                    </div>
                </div>


                <!-- Botones del formulario  -->
                <div class="btns_po">
                    <button type="button" id="btn_cancel_po">
                        Cancelar
                    </button>
                    <button type="submit" id="btn_save_po">
                        <i class="bi bi-floppy-fill"></i>
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>



    <!-- ==========================================
     MODAL CONFIRMAR ELIMINACIÓN DE USUARIO
        ========================================== -->

    <div id="delete_po_js" class="delete_user_modal_overlay" hidden>

        <div class="delete_user_modal" role="alertdialog" aria-modal="true" aria-labelledby="delete_user_title"
            aria-describedby="delete_user_message">

            <!-- ENCABEZADO Y BOTÓN CERRAR -->
            <div class="delete_user_modal_header">

                <button type="button" id="btn_close_delete_user" aria-label="Cerrar ventana">

                    <i class="bi bi-x-lg"></i>

                </button>

            </div>

            <!-- ÍCONO DE ADVERTENCIA -->
            <div class="delete_user_icon">

                <i class="bi bi-exclamation-circle-fill"></i>

            </div>

            <!-- MENSAJE DE CONFIRMACIÓN -->
            <h2 id="delete_user_title">
                ¿Eliminar usuario?
            </h2>

            <p id="delete_user_message">
                ¿Estás seguro de que deseas eliminar
                el usuario seleccionado?
            </p>

            <!-- BOTONES -->
            <div class="delete_user_modal_actions">

                <button type="button" id="btn_cancel_delete_user">
                    Cancelar
                </button>

                <button type="button" id="btn_confirm_delete_user">

                    <i class="bi bi-trash-fill"></i>
                    Eliminar

                </button>

            </div>

        </div>

    </div>





</section>
