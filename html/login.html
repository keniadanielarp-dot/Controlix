<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicio de sesión</title> <!-- Agrega el titulo en la pestaña del buscador -->

    <!-- Bootstrap 5 local -->
    <link rel="stylesheet"
          href="../bootstrap/css/bootstrap.min.css">

    <!-- Cargar íconos de bootstrap locales  -->
    <link rel="stylesheet" href="../css/bootstrap-icons.css">

    <!-- Referencia a css -->
    <link rel="stylesheet" href="../css/login.css">

    <!--Referencia a js-->
    <link rel="stylesheet" href="../js/login.js">
</head>

<body>

    <main class="login_container"> <!-- Contenido de la página de Login-->

        <!-- Título del Programa -->
        <section class="program_info">
            <div class="program_title">
                <img
                    src="../img/controlix.png"
                    alt="Logo"
                    class="controlix_logo">

                    <h1>Controlix</h1>
            </div>            
        </section>

        <!-- Inicio de la tarjeta grafica de "Inicio de Sesión" -->
        <section class="graphic_card">

            <!-- Titulo de la tarjeta-->
            <h2 class="title_login">
                Iniciar sesión
            </h2>

            <div id="alert_login" class="alert alert-danger text-center d-none" role="alert">
                Usuario y/o contraseña incorrectos. Inténtelo de nuevo.
            </div>

            <!-- Mensaje para usuario correcto, contraseña incorrecta -->
            <div id="alert_login2" class="alert alert-danger text-center d-none" role="alert">
                Usuario y/o contraseña incorrectos. Inténtelo de nuevo.
            </div>

            <div id="alert_status" class="alert alert-danger text-center d-none" role="alert">
                Usuario inactivo. 
            </div>

            <!-- Formulario que permite a los usuarios introducir y enviar datos a un servidor web para su procesamiento.--> 
            <form id="form_alert" class="login_form" method="post" action="../php/login.php">

                
                <!-- <div> Contenedor genérico utilizado para agrupar elementos HTML y estructurar contenido en una página web. Es extremadamente útil cuando se combina con CSS o JavaScript para diseño y manipulación.-->
                
                <!-- Agrupamiento Usuario -->
                <div class="form_group">
                    <label for="user">
                        Usuario:
                    </label>

                    <div class="input_container"> <!-- Agrupación del TextBox-->

                        <i class="bi bi-person-fill"></i> <!-- Muestra el texto diferente al texto normal-->
                        <input
                            type="text" 
                            id="user"
                            name="user_login"
                            placeholder="Ingrese su usuario"
                            required>

                    </div>
                </div> <!-- Finalización del agrupamiento de Usuario-->

                <!-- Agrupamiento Contraseña -->
                <div class="form_group">

                    <label for="pass">
                        Contraseña:
                    </label>

                    <div class="input_container">

                        <i class="bi bi-lock-fill"></i>
                        <i class="bi bi-eye-slash eye_pass"></i>
                        <input
                            type="password"
                            id="pass"
                            name="pass_login"
                            placeholder="Ingrese su contraseña" 
                            required>
                            
                    </div>
                </div> <!-- Finalización del agrupamiento de Contraseña-->


                <!-- Botón Ingresar -->
                <button
                    type="submit"
                    class="contact_button">
                    Ingresar
                </button> <!-- Fin Boton-->


                <!-- Recuperar Contraseña -->
                <div class="forgot_pass">

                    <a href="recover_pass.html">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div> <!-- Fin Recuperar Contraseña-->

            </form> <!-- Fin del formulario-->

        </section> <!-- Fin de la tarjeta grafica -->
    </main> <!-- Fin del contenido de la pagina Login -->
    <script src="../js/login.js"></script>
</body>
</html>
