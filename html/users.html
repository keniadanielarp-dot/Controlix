<!-- Contenido principal de Usuarios -->
<section class="users_content">

    <!-- Encabezado-->
    <div class="users_header">

        <!-- Título e información -->
        <div class="users_title">
            <i class="bi bi-people-fill"></i>
            <div>
                <h1>Usuarios</h1>
                <p>Administra los usuarios del sistema.</p>
            </div>
        </div>
    </div>

    <!-- Buscador -->
    <div class="search_prop">
        <div class="users_search">
            <i class="bi bi-search"></i>
            <input type="search" id="search_user" placeholder="Buscar por ID, nombre o usuario...">
        </div>
    </div>


    <!-- CheckBox Seleccionar todo -->
    <div class="users_selection">

        <!-- Seleccionar todos los usuarios -->
        <label class="select_all_label">

            <input type="checkbox" id="select_all_users">

            <span>Seleccionar todo</span>

        </label>


        <!-- Botones de administración -->
        <div class="users_actions">

            <button type="button" id="btn_new_user">
                <i class="bi bi-plus-circle-fill"></i>
                Nuevo
            </button>

            <button type="button" id="btn_edit_user">
                <i class="bi bi-pencil-fill"></i>
                Editar
            </button>

            <button type="button" id="btn_delete_user">
                <i class="bi bi-trash-fill"></i>
                Eliminar
            </button>



        </div>

    </div>


    <!-- =====================================
         TABLA DE USUARIOS
    ===================================== -->
    <div class="users_table_container">

        <table class="users_table">

            <!-- Encabezados -->
            <thead>
                <tr>
                    <th></th>
                    <th>ID</th>
                    <th>Nombre de usuario</th>
                    <th>Usuario</th>
                    <th>Contraseña</th>
                    <th>Rol</th>
                </tr>
            </thead>


            <!-- Registros de usuarios -->
            <tbody id="users_table_body"></tbody>

        </table>

    </div>

    <!-- ==========================================
     MODAL NUEVO USUARIO
========================================== -->

    <div id="new_user_modal" class="new_user_modal_overlay" hidden>

        <!-- Cuadro central -->
        <div class="new_user_modal" role="dialog" aria-modal="true" aria-labelledby="new_user_title">

            <!-- =====================================
             ENCABEZADO
        ===================================== -->
            <div class="new_user_modal_header">

                <h2 id="new_user_title">
                    Nuevo usuario
                </h2>

                <button type="button" id="btn_close_new_user" aria-label="Cerrar ventana">

                    <i class="bi bi-x-lg"></i>

                </button>

            </div>


            <!-- =====================================
             FORMULARIO
        ===================================== -->
            <form id="new_user_form" novalidate>

                <!-- Nombre completo -->
                <div class="new_user_form_group">

                    <label for="new_user_name">
                        Nombre completo
                        <span class="required_field">*</span>
                    </label>

                    <input type="text" id="new_user_name" name="txt_name_user" placeholder="Ingresa el nombre completo"
                        autocomplete="name" required>

                    <small class="new_user_field_error" id="error_new_user_name" hidden></small>

                </div>


                <!-- Nombre de usuario -->
                <div class="new_user_form_group">

                    <label for="new_username">
                        Usuario
                        <span class="required_field">*</span>
                    </label>

                    <input type="text" id="new_username" name="txt_new_user" placeholder="Ingresa el nombre de usuario"
                        autocomplete="off" required>

                    <small class="new_user_field_error" id="error_new_username" hidden></small>

                </div>


                <!-- Contraseña -->
                <div class="new_user_form_group">

                    <label for="new_user_password">
                        Contraseña
                        <span class="required_field">*</span>
                    </label>

                    <div class="new_user_password_container">

                        <input type="password" id="new_user_password" name="txt_new_pass"
                            placeholder="Ingresa la contraseña" autocomplete="new-password" minlength="8" required>

                        <button type="button" class="new_user_eye" aria-label="Mostrar contraseña">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                    <small class="new_user_field_error" id="error_new_user_password" hidden></small>

                </div>


                <!-- Confirmar contraseña -->
                <div class="new_user_form_group">

                    <label for="new_user_confirm_password">
                        Confirmar contraseña
                        <span class="required_field">*</span>
                    </label>

                    <div class="new_user_password_container">

                        <input type="password" id="new_user_confirm_password" name="txt_conf_new_pass"
                            placeholder="Confirma la contraseña" autocomplete="new-password" minlength="8" required>

                        <button type="button" class="new_user_eye" aria-label="Mostrar confirmación de contraseña">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                    <small class="new_user_field_error" id="error_new_user_confirm_password" hidden></small>

                </div>


                <!-- Rol -->
                <div class="new_user_form_group">

                    <label for="new_user_role">
                        Rol
                        <span class="required_field">*</span>
                    </label>

                    <select id="new_user_role" name="ddl_rol" required>

                        <option value="">
                            Selecciona un rol
                        </option>

                    </select>

                    <small class="new_user_field_error" id="error_new_user_role" hidden></small>

                </div>


                <!-- Estado -->
                <div class="new_user_form_group">

                    <label for="new_user_status">
                        Estado
                        <span class="required_field">*</span>
                    </label>

                    <select id="new_user_status" name="ddl_status" required>

                        <option value="">
                            Selecciona el estado
                        </option>

                        <option value="1">
                            Activo
                        </option>

                        <option value="0">
                            Inactivo
                        </option>

                    </select>

                    <small class="new_user_field_error" id="error_new_user_status" hidden></small>

                </div>


                <!-- =====================================
                 BOTONES
            ===================================== -->
                <div class="new_user_modal_actions">

                    <button type="button" id="btn_cancel_new_user">
                        Cancelar
                    </button>

                    <button type="submit" id="btn_save_new_user">

                        <i class="bi bi-floppy-fill"></i>
                        Guardar

                    </button>

                </div>



            </form>

        </div>

    </div>

    <!-- ==========================================
     NOTIFICACIÓN DE NUEVO USUARIO
        ========================================== -->

    <div id="new_user_notification" hidden>

        <!-- Ícono de éxito o error -->
        <div id="user_notification_icon"></div>

        <!-- Título de la notificación -->
        <h3 id="user_notification_title"></h3>

        <!-- Mensaje de la notificación -->
        <p id="user_notification_message"></p>

        <!-- Botón de notificación -->
        <div class="user_notification_actions">

            <button type="button" id="btn_notification_accept">
                Aceptar
            </button>

        </div>

    </div>



    <!-- ==========================================
     MODAL EDITAR USUARIO
        ========================================== -->

    <div id="edit_user_modal" class="edit_user_modal_overlay" hidden>

        <div class="edit_user_modal" role="dialog" aria-modal="true" aria-labelledby="edit_user_title">

            <!-- ENCABEZADO -->
            <div class="edit_user_modal_header">

                <h2 id="edit_user_title">
                    Editar usuario
                </h2>

                <button type="button" id="btn_close_edit_user" aria-label="Cerrar ventana">
                    <i class="bi bi-x-lg"></i>
                </button>

            </div>

            <!-- FORMULARIO -->
            <form id="edit_user_form" novalidate>

                <!-- ID DEL USUARIO -->
                <div class="edit_user_form_group">

                    <label for="edit_user_id">
                        ID del usuario
                    </label>

                    <input type="text" id="edit_user_id" readonly>

                </div>

                <!-- NOMBRE COMPLETO -->
                <div class="edit_user_form_group">

                    <label for="edit_user_name">
                        Nombre completo
                        <span class="required_field">*</span>
                    </label>

                    <input type="text" id="edit_user_name" name="name_user" required>

                    <small class="edit_user_field_error" id="error_edit_user_name" hidden></small>

                </div>

                <!-- NOMBRE DE USUARIO -->
                <div class="edit_user_form_group">

                    <label for="edit_username">
                        Usuario
                        <span class="required_field">*</span>
                    </label>

                    <input type="text" id="edit_username" name="usuario" required>

                    <small class="edit_user_field_error" id="error_edit_username" hidden></small>

                </div>

                <!-- CONTRASEÑA -->
                <div class="edit_user_form_group">

                    <label for="edit_user_password">
                        Nueva contraseña
                    </label>

                    <div class="edit_user_password_container">

                        <input type="password" id="edit_user_password" name="password"
                            placeholder="Dejar en blanco para conservar" autocomplete="new-password">

                        <button type="button" class="edit_user_eye" aria-label="Mostrar contraseña">
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                    <small class="edit_user_hint">
                        Déjala vacía si no deseas cambiarla.
                    </small>

                    <small class="edit_user_field_error" id="error_edit_user_password" hidden></small>

                </div>

                <!-- CONFIRMAR CONTRASEÑA -->
                <div class="edit_user_form_group">

                    <label for="edit_user_confirm_password">
                        Confirmar contraseña
                    </label>

                    <div class="edit_user_password_container">

                        <input type="password" id="edit_user_confirm_password" name="confirm_password"
                            placeholder="Confirma la nueva contraseña" autocomplete="new-password">

                        <button type="button" class="edit_user_eye" aria-label="Mostrar confirmación">
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                    <small class="edit_user_field_error" id="error_edit_user_confirm_password" hidden></small>

                </div>

                <!-- ROL -->
                <div class="edit_user_form_group">

                    <label for="edit_user_role">
                        Rol
                        <span class="required_field">*</span>
                    </label>

                    <select id="edit_user_role" name="id_rol" required>

                        <option value="">
                            Selecciona un rol
                        </option>

                    </select>

                    <small class="edit_user_field_error" id="error_edit_user_role" hidden></small>

                </div>

                <!-- ESTADO -->
                <div class="edit_user_form_group">

                    <label for="edit_user_status">
                        Estado
                        <span class="required_field">*</span>
                    </label>

                    <select id="edit_user_status" name="tercera_columna" required>

                        <option value="">
                            Selecciona el estado
                        </option>

                        <option value="1">Activo</option>
                        <option value="0">Inactivo</option>

                    </select>

                    <small class="edit_user_field_error" id="error_edit_user_status" hidden></small>

                </div>

                <!-- BOTONES -->
                <div class="edit_user_modal_actions">

                    <button type="button" id="btn_cancel_edit_user">
                        Cancelar
                    </button>

                    <button type="submit" id="btn_save_edit_user">

                        <i class="bi bi-floppy-fill"></i>
                        Guardar cambios

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- ==========================================
     MODAL CONFIRMAR ELIMINACIÓN DE USUARIO
        ========================================== -->

    <div id="delete_user_modal" class="delete_user_modal_overlay" hidden>

        <div class="delete_user_modal" role="alertdialog" aria-modal="true" aria-labelledby="delete_user_title"
            aria-describedby="delete_user_message">

            <!-- ENCABEZADO Y BOTÓN CERRAR -->
            <div class="delete_user_modal_header">

                <button type="button" id="btn_close_delete_user" aria-label="Cerrar ventana">

                    <i class="bi bi-x-lg"></i>

                </button>

            </div>

            <!-- ÍCONO DE ADVERTENCIA -->
            <div class="delete_user_icon">

                <i class="bi bi-exclamation-circle-fill"></i>

            </div>

            <!-- MENSAJE DE CONFIRMACIÓN -->
            <h2 id="delete_user_title">
                ¿Eliminar usuario?
            </h2>

            <p id="delete_user_message">
                ¿Estás seguro de que deseas eliminar
                el usuario seleccionado?
            </p>

            <!-- BOTONES -->
            <div class="delete_user_modal_actions">

                <button type="button" id="btn_cancel_delete_user">
                    Cancelar
                </button>

                <button type="button" id="btn_confirm_delete_user">

                    <i class="bi bi-trash-fill"></i>
                    Eliminar

                </button>

            </div>

        </div>

    </div>

</section>
